name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows 宿主：全量测试主战场（测试套件绑 test/sqlite3.dll + win-x64 pdfium，均已入库）
  test-windows:
    name: analyze + 全量测试（Windows）
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Linux 宿主：试探性验证（PDF/金样用例自动 SKIP；sqlite3 走系统库）
  test-linux:
    name: analyze + 测试（Linux，非阻断试探）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统 libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # 打 tag（v*）时：Android release 构建并附到草稿 Release（发布前可编辑中文说明）
  release-android:
    name: Android APK 出包（tag 触发）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-windows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      # 签名密钥还原：显式 release 签名（key.properties 模式），不依赖 runner 的
      # debug 默认路径（AGP 在 CI 会现场生成随机密钥 → 跨签名无法覆盖安装）。
      # 凭据全部走 GitHub Secrets（配置清单见 AGENTS.md「发布签名 Secrets 清单」）；
      # Secrets 未配置时密码为空 → 构建失败，属预期防护。
      - name: 还原 APK 签名密钥（显式 release 签名）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/hengya-release.keystore"
          cat > android/key.properties <<EOF
          storeFile=$HOME/hengya-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "keystore restored: $(wc -c < "$HOME/hengya-release.keystore") bytes"

      - run: flutter build apk --release

      - name: 计算哈希并核对签名证书（指纹不符即中止，杜绝坏包进通道）
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep 'SHA-256 digest' | head -1 | grep -oE '[0-9a-f]{64}')
          EXPECTED=86e812bd4721e2f4a6f8a5735cb0dbcb3cf3f495de5fcc57858c64240d96f877
          echo "cert SHA-256: $ACTUAL"
          echo "expected    : $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名证书指纹与历史版本不一致，中止发版（APK 未进任何通道）"
            exit 1
          fi

      - name: 附到 Release（不存在则建草稿）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk hengya-${{ github.ref_name }}-release.apk
          gh release create "$GITHUB_REF_NAME" \
            --title "恒牙 $GITHUB_REF_NAME" \
            --generate-notes --draft \
            "hengya-${{ github.ref_name }}-release.apk" \
          || gh release upload "$GITHUB_REF_NAME" "hengya-${{ github.ref_name }}-release.apk" --clobber

      # ECS 更新通道自动同步：latest.json 的 versionCode/sha256/sizeBytes 全自动生成
      # 连接信息全部来自 Secrets（IP/token 路径/私钥不进公开仓库）
      - name: 同步 ECS 更新通道
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PATH: ${{ secrets.ECS_PATH }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: |
          APK="hengya-${GITHUB_REF_NAME}-release.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/\r//')
          CODE=${VERSION#*+}
          cat > latest.json <<EOF
          {
            "versionName": "${VERSION}",
            "versionCode": ${CODE},
            "apk": "${APK}",
            "sha256": "${SHA}",
            "sizeBytes": ${SIZE},
            "date": "$(date +%F)",
            "notes": "恒牙 ${GITHUB_REF_NAME}：更新说明见 GitHub Release https://github.com/long2004at/hengya/releases/tag/${GITHUB_REF_NAME}"
          }
          EOF
          # Ed25519 清单签名（安全修复 B）：canonical payload 五字段竖线拼接，
          # 与 App 端 update_service.dart 逐字段一致；签名 base64 无换行注入
          # 顶层 signature 字段（新版 App 拒绝无签名清单）
          printf '%s' "$UPDATE_SIGN_KEY" > /tmp/update_sign_key.pem
          if [ ! -s /tmp/update_sign_key.pem ]; then
            echo "::error::UPDATE_SIGN_KEY secret 未配置，拒绝产出无签名清单"; exit 1
          fi
          printf '%s' "${VERSION}|${CODE}|${APK}|${SHA}|${SIZE}" > /tmp/manifest_payload.txt
          openssl pkeyutl -sign -inkey /tmp/update_sign_key.pem -rawin \
            -in /tmp/manifest_payload.txt -out /tmp/manifest_sig.bin
          SIG=$(base64 -w0 /tmp/manifest_sig.bin)
          jq --arg sig "$SIG" '. + {signature: $sig}' latest.json > latest.json.tmp \
            && mv latest.json.tmp latest.json
          rm -f /tmp/update_sign_key.pem /tmp/manifest_payload.txt /tmp/manifest_sig.bin
          cat latest.json
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          # 先传 APK 后传 latest.json：客户端永远看不到指向缺失文件的清单
          scp -i ~/.ssh/ecs_key -P "$ECS_PORT" -o StrictHostKeyChecking=accept-new "$APK" "$ECS_USER@$ECS_HOST:$ECS_PATH/"
          scp -i ~/.ssh/ecs_key -P "$ECS_PORT" -o StrictHostKeyChecking=accept-new latest.json "$ECS_USER@$ECS_HOST:$ECS_PATH/"
          echo "ECS 同步完成"

      # GitHub 更新通道：回写 update/latest.json（apk 为 Release 资产绝对链接）
      # 海外/备份通道；国内手机建议走 ECS 通道（raw.githubusercontent 国内连通性不稳）
      - name: 回写 GitHub 更新通道 update/latest.json
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="hengya-${TAG}-release.apk"
          APK_URL="https://github.com/long2004at/hengya/releases/download/${TAG}/${APK}"
          VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/\r//')
          CODE=${VERSION#*+}
          SHA=$(sha256sum "app/${APK}" | cut -d' ' -f1)
          SIZE=$(stat -c%s "app/${APK}")
          mkdir -p update
          cat > update/latest.json <<EOF
          {
            "versionName": "${VERSION}",
            "versionCode": ${CODE},
            "apk": "${APK_URL}",
            "sha256": "${SHA}",
            "sizeBytes": ${SIZE},
            "date": "$(date +%F)",
            "notes": "恒牙 ${TAG}：更新说明见 GitHub Release https://github.com/long2004at/hengya/releases/tag/${TAG}"
          }
          EOF
          # Ed25519 清单签名（安全修复 B）：canonical payload 五字段竖线拼接
          # （此通道 apk 字段为 Release 资产绝对链接 APK_URL），与 App 端
          # update_service.dart 逐字段一致；签名 base64 无换行注入顶层 signature
          printf '%s' "$UPDATE_SIGN_KEY" > /tmp/update_sign_key.pem
          if [ ! -s /tmp/update_sign_key.pem ]; then
            echo "::error::UPDATE_SIGN_KEY secret 未配置，拒绝产出无签名清单"; exit 1
          fi
          printf '%s' "${VERSION}|${CODE}|${APK_URL}|${SHA}|${SIZE}" > /tmp/manifest_payload.txt
          openssl pkeyutl -sign -inkey /tmp/update_sign_key.pem -rawin \
            -in /tmp/manifest_payload.txt -out /tmp/manifest_sig.bin
          SIG=$(base64 -w0 /tmp/manifest_sig.bin)
          jq --arg sig "$SIG" '. + {signature: $sig}' update/latest.json > update/latest.json.tmp \
            && mv update/latest.json.tmp update/latest.json
          rm -f /tmp/update_sign_key.pem /tmp/manifest_payload.txt /tmp/manifest_sig.bin
          cat update/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git commit -m "chore: GitHub 更新通道 latest.json → ${TAG} [skip ci]" || echo "latest.json 无变更"
          git push origin HEAD:main
