name: ECS 通道连通性测试

# 手动触发（Actions 页 → 本 workflow → Run workflow）：
# 验证 Secrets 配置与 GitHub runner → ECS 的 SFTP 通路（tag 发版依赖此通路）
# ECS 账户为受限 SFTP-only 账户（internal-sftp + chroot），不支持 shell，须用 sftp 子命令
on:
  workflow_dispatch:

jobs:
  ping:
    name: SFTP 连通测试（runner → ECS）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 连接并列出更新通道目录
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PATH: ${{ secrets.ECS_PATH }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          printf 'ls -la %s\n' "$ECS_PATH" \
            | sftp -i ~/.ssh/ecs_key -P "$ECS_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$ECS_USER@$ECS_HOST"
